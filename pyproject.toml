[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-jobhunter"
version = "0.1.0"
description = "Self-hosted AI assistant for finding and ranking freelance opportunities"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-socks[asyncio]>=2.7,<3",
  "pypdf>=5,<7",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "telethon>=1.38,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
