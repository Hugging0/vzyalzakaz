name: Browser Extension

on:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/browser-extension.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Test
        working-directory: extension
        run: npm test
      - name: Typecheck
        working-directory: extension
        run: npm run typecheck
      - name: Package Chrome build
        working-directory: extension
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: vzyalzakaz-chrome-extension
          path: extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14
