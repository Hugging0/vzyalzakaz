services:
  jobhunter:
    # The VPS resolver currently returns an unreachable Telegram API address.
    # Keep TLS hostname verification while routing the Bot API to a reachable IPv4 endpoint.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

volumes:
  certbot_www:
    name: huntagent_certbot_www
