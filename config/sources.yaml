  # Public API / lightweight web adapters. Automated application is disabled.
  - name: hh_ru
    type: api
    content_policy: demand_only
    language: ru
    priority: tier_a
    enabled: false
    collector: hh
    apply_mode: draft_only
    poll_interval: 900
    url: https://api.hh.ru/vacancies
    options: {query: "Python OR FastAPI OR автоматизация OR LLM", limit: 50}

  - name: remotive
    type: api
    content_policy: demand_only
    language: en
    priority: tier_a
    # Remotive currently returns HTTP 403 from the production VPS. Re-enable after access is restored.
    enabled: false
    collector: remotive
    apply_mode: draft_only
    poll_interval: 900
    url: https://remotive.com/api/remote-jobs
    options: {query: "python automation", limit: 30}

  - name: remotive_design
    type: api
    content_policy: demand_only
    language: en
    priority: tier_a
    enabled: false
    collector: remotive
    apply_mode: draft_only
    poll_interval: 21600
    url: https://remotive.com/api/remote-jobs
    options: {category: design, limit: 30}

  - name: remotive_marketing
