  # Additional catalog, 2026-09-01. Only sources with a verified, stable production
  # adapter are enabled. `pending` entries are documented candidates and never reach
  # create_collector while disabled.

  # Verified public API / feed adapters
  - name: himalayas
    type: api
    content_policy: demand_only
    language: en
    priority: tier_a
    enabled: true
    collector: himalayas
    apply_mode: draft_only
    poll_interval: 86400
    url: https://himalayas.app/jobs/api
    options: {limit: 20}

  - name: freelancer_com
    display_name: Freelancer
    type: api
    content_policy: demand_only
    language: multi
    priority: tier_a
    enabled: true
    collector: freelancer
    apply_mode: draft_only
    submission_type: browser_extension
    adapter_id: freelancer_com
    application_hosts: [freelancer.com]
    capabilities: [collect, browser_autofill, custom_questions, requires_auth, requires_confirmation]
    poll_interval: 1800
    url: https://www.freelancer.com/api/projects/0.1/projects/active/
    options: {limit: 50}

  - name: working_nomads
    type: api
    content_policy: demand_only
    language: en
    priority: tier_a
    enabled: true
    collector: working_nomads
    apply_mode: draft_only
    poll_interval: 3600
    url: https://www.workingnomads.com/api/exposed_jobs/
    options: {limit: 100}

  - name: problogger_jobs
    type: web
    content_policy: demand_only
    language: en
    priority: tier_a
    enabled: true
    collector: problogger
    apply_mode: draft_only
    poll_interval: 10800
    url: https://problogger.com/jobs/

