server {
    listen 80;
    server_name vzyalzakaz.ru www.vzyalzakaz.ru tg.vzyalzakaz.ru;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vzyalzakaz.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.vzyalzakaz.ru tg.vzyalzakaz.ru;

    ssl_certificate /etc/letsencrypt/live/vzyalzakaz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vzyalzakaz.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://vzyalzakaz.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name vzyalzakaz.ru;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/vzyalzakaz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vzyalzakaz.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Temporary landing behavior. Keep this non-permanent so an SEO home page
    # can replace it without fighting a cached redirect.
    location = / {
        return 302 /app;
    }

    location /api/ {
        proxy_pass http://jobhunter:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
