services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunter} -d ${POSTGRES_DB:-jobhunter}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  jobhunter:
    build: .
    env_file: .env
    environment:
      CONFIG_DIR: /app/config
      TELEGRAM_SESSION_PATH: /data/jobhunter
    volumes:
      - ./config:/app/config:ro
      - telegram_data:/data
    ports:
      - "127.0.0.1:${JOBHUNTER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
        NEXT_PUBLIC_EXTENSION_ID: ${NEXT_PUBLIC_EXTENSION_ID:-}
    environment:
      BACKEND_URL: http://jobhunter:8000
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-vzyal_zakaz_bot}
    depends_on:
      - jobhunter
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - jobhunter
    restart: unless-stopped

volumes:
  postgres_data:
  telegram_data:
